<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>reel.tv</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" src="src/data.jsx"></script>
<script type="text/babel" src="src/icons.jsx"></script>
<script type="text/babel" src="src/Thumbnail.jsx"></script>
<script type="text/babel" src="src/components.jsx"></script>

<script type="text/babel" data-presets="env,react">
  const mount = () => {
    const el = document.getElementById('root');
    if (!el || !window.App) { setTimeout(mount, 30); return; }
    ReactDOM.createRoot(el).render(<window.App/>);
  };
  mount();
</script>
</body>
</html>
